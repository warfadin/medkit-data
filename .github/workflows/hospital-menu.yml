name: Hospital menu

on:
  schedule:
    - cron: '0 6 1-3 * *' # 09:00 in Europe/Istanbul
  workflow_dispatch:
    inputs:
      mode:
        description: Check the source, preview extraction, or publish
        type: choice
        options: [source, preview, publish]
        default: source

permissions:
  contents: write

concurrency:
  group: hospital-menu
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
      - name: Check and validate the hospital menu
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MENU_MODEL: ${{ vars.OPENAI_MENU_MODEL }}
          MENU_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
        run: python3 scripts/update_hospital_menu.py "$MENU_MODE"
      - name: Publish the validated menu
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          path=menus/hospital-menu-current.json
          git diff --check -- "$path"
          if git diff --quiet -- "$path"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          period=$(python3 -c 'import json,sys; print("{year}-{month:02d}".format(**json.load(open(sys.argv[1]))))' "$path")
          git add -- "$path"
          git commit -m "Update hospital menu for $period" -- "$path"
          git push origin HEAD:main
